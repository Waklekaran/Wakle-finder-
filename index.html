
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wakle-Finder</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <header>
    <h1>Wakle-Finder 🔍</h1>
    <p>Find it. Verify it. Get it back.</p>
  </header>

  <main>

    <!-- HOME SCREEN -->
    <section id="homeScreen">
      <h2>Welcome to Wakle-Finder</h2>
      <p>Your Campus Lost & Found Platform.</p>

      <button onclick="reportLostItem()">
        Report Lost Item
      </button>

      <button onclick="reportFoundItem()">
        Report Found Item
      </button>
    </section>

    <!-- REPORT FORM SCREEN -->
    <section id="reportScreen" style="display:none;">
      <h2>Report an Item</h2>

      <form id="itemForm">
        <label>Item Name</label>
        <input type="text" id="itemName"
          placeholder="Example: College ID" required>

        <label>Report Type</label>
        <select id="itemType" required>
          <option value="">Select type</option>
          <option value="Lost">Lost</option>
          <option value="Found">Found</option>
        </select>

        <label>Description</label>
        <textarea id="itemDescription"
          placeholder="Describe the item" required></textarea>

        <label>Location</label>
        <input type="text" id="itemLocation"
          placeholder="Where was it lost/found?" required>

        <label>Date</label>
        <input type="date" id="itemDate" required>

        <button type="submit">Submit Report</button>
      </form>

      <button onclick="showHome()">Back to Home</button>
    </section>
    
<!-- SUCCESS SCREEN -->
<section id="successScreen" style="display:none;">
  <h2>Report Submitted Successfully! 🎉</h2>

  <p>Your report has been saved.</p>

  <div id="submittedReportPreview"></div>

  <button onclick="showReports()">
    View Recent Reports
  </button>

  <button onclick="showHome()">
    Back to Home
  </button>
</section>


    <!-- RECENT REPORTS SCREEN -->
    <section id="reportsScreen" style="display:none;">
      <h2>Recent Reports</h2>

      <input type="text" id="searchInput"
        placeholder="Search reports...">

      <h3>Lost Reports</h3>
      <div id="lostReportsList"></div>

      <h3>Found Reports</h3>
      <div id="foundReportsList"></div>

      <button onclick="showHome()">Back to Home</button>
    </section>

    <!-- REPORT DETAILS SCREEN -->
    <section id="detailsScreen" style="display:none;">
      <h2>Report Details</h2>
      <div id="reportDetails"></div>

      <button onclick="showReports()">
        Back to Recent Reports
      </button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
